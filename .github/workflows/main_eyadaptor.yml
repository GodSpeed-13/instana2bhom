name: Build and deploy Python project to Azure Function App - instana2bhom

on:
  push:
    branches: main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.' 
  PYTHON_VERSION: '3.12'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies into .python_packages
        run: |
          python -m pip install --upgrade pip
          # install into relative .python_packages folder that Azure Functions looks for
          python -m pip install --no-cache-dir -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Show installed packages (debug)
        run: |
          echo "Listing .python_packages/lib/site-packages (top 50):"
          ls -la .python_packages/lib/site-packages | head -n 50
          echo "Check requests import:"
          python - <<PY
          import sys
          sys.path.insert(0, '.python_packages/lib/site-packages')
          try:
              import requests
              print('requests OK', requests.__version__)
          except Exception as e:
              print('requests import failed:', e)
          PY

      - name: Zip artifact for deployment
        run: |
          # include everything (code + .python_packages) into release.zip
          zip -r release.zip . -x "venv/*" ".git/*" "__pycache__/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
  
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
  
      - name: Unzip artifact
        run: |
          unzip release.zip
          rm release.zip
  
      - name: Deploy to Azure Function App (Flex Consumption)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'eyadaptor'
          slot-name: 'Production'
          package: '.'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_4CF15F60649C4C1F9215235CC508C1FD }}

