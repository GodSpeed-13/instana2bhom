name: Build and deploy Python project to Azure Function App - instana2bhom

on:
  push:
    branches: main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'  # safer
  PACKAGE_NAME: 'release.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies into .python_packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Zip artifact
        run: |
          zip -r ${{ env.PACKAGE_NAME }} . -x "venv/*" ".git/*" "__pycache__/*"

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: ${{ env.PACKAGE_NAME }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'instana-bhom'
          slot-name: 'Production'
          package: ${{ env.PACKAGE_NAME }}

